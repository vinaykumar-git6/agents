<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Best Practices - Architecture Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-content h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .header-content p {
            color: #666;
            font-size: 1em;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        
        .back-btn:hover {
            transform: scale(1.05);
        }
        
        .summary-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .summary-card-value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .summary-card-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .services-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .section-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .service-card {
            background: #f8f9ff;
            border-left: 5px solid #667eea;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        
        .service-card:hover {
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }
        
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .service-name {
            color: #667eea;
            font-size: 1.4em;
            font-weight: 600;
        }
        
        .service-category {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .service-description {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95em;
            line-height: 1.5;
        }
        
        .best-practices-list {
            list-style: none;
            padding: 0;
        }
        
        .best-practice-item {
            background: white;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 3px solid #4caf50;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .best-practice-item:before {
            content: "✓";
            color: #4caf50;
            font-weight: bold;
            font-size: 1.2em;
            flex-shrink: 0;
        }
        
        .learn-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .learn-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        .learn-link:before {
            content: "📚 ";
        }
        
        .architecture-checklist {
            background: #fff9e6;
            border: 2px solid #ffa726;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .checklist-title {
            color: #f57c00;
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .checklist-item {
            background: white;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #ffa726;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
            font-size: 1.2em;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🏗️ Azure Best Practices</h1>
                <p>Comprehensive best practices and recommendations for your architecture</p>
            </div>
            <a href="/" class="back-btn">← Back to Analyzer</a>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading best practices...</p>
        </div>
        
        <div id="error" class="error-message" style="display: none;"></div>
        
        <div id="content" style="display: none;">
            <div class="summary-section">
                <h2 class="section-title">Summary</h2>
                <div id="summary-text" style="color: #666; line-height: 1.6; margin-bottom: 20px;"></div>
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="summary-card-value" id="totalServices">0</div>
                        <div class="summary-card-label">Azure Services</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-value" id="totalRecommendations">0</div>
                        <div class="summary-card-label">Recommendations</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-value" id="totalChecklist">0</div>
                        <div class="summary-card-label">Checklist Items</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-card-value" id="cloudProvider">Azure</div>
                        <div class="summary-card-label">Cloud Provider</div>
                    </div>
                </div>
            </div>
            
            <div class="services-section">
                <h2 class="section-title">Service-Specific Best Practices</h2>
                <div id="servicesList"></div>
                
                <div class="architecture-checklist">
                    <div class="checklist-title">🎯 Architecture Checklist</div>
                    <div id="checklistItems"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function loadBestPractices() {
            try {
                const response = await fetch('/api/latest-best-practices');
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to load best practices');
                }
                
                displayBestPractices(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `Error: ${error.message}. Please analyze a diagram first.`;
            }
        }
        
        function displayBestPractices(data) {
            const { best_practices, cloud_provider, total_services, azure_services } = data;
            
            // Update summary
            document.getElementById('summary-text').textContent = best_practices.summary || 'Azure best practices for your architecture';
            document.getElementById('totalServices').textContent = total_services || 0;
            document.getElementById('totalRecommendations').textContent = best_practices.total_recommendations || 0;
            document.getElementById('totalChecklist').textContent = best_practices.architecture_checklist?.length || 0;
            document.getElementById('cloudProvider').textContent = cloud_provider || 'Azure';
            
            // Display service recommendations
            const servicesList = document.getElementById('servicesList');
            const serviceRecommendations = best_practices.service_recommendations || [];
            
            if (serviceRecommendations.length === 0) {
                servicesList.innerHTML = '<p style="color: #666;">No service-specific recommendations available.</p>';
            } else {
                servicesList.innerHTML = serviceRecommendations.map(rec => {
                    const serviceName = rec.service_name;
                    const practices = rec.best_practices || [];
                    
                    // Find service category from azure_services
                    const serviceInfo = azure_services?.find(s => s.service_name === serviceName);
                    const category = serviceInfo?.category || 'General';
                    const description = serviceInfo?.description || '';
                    
                    // Generate Microsoft Learn link
                    const searchQuery = serviceName.replace(/Azure\s+/gi, '').replace(/\s+/g, '+');
                    const learnUrl = `https://learn.microsoft.com/en-us/search/?terms=${searchQuery}+best+practices`;
                    
                    return `
                        <div class="service-card">
                            <div class="service-header">
                                <div class="service-name">${serviceName}</div>
                                <div class="service-category">${category}</div>
                            </div>
                            ${description ? `<div class="service-description">${description}</div>` : ''}
                            <ul class="best-practices-list">
                                ${practices.map(practice => `
                                    <li class="best-practice-item">${practice}</li>
                                `).join('')}
                            </ul>
                            <a href="${learnUrl}" target="_blank" class="learn-link">
                                View ${serviceName} documentation on Microsoft Learn
                            </a>
                        </div>
                    `;
                }).join('');
            }
            
            // Display architecture checklist
            const checklistItems = document.getElementById('checklistItems');
            const checklist = best_practices.architecture_checklist || [];
            
            if (checklist.length === 0) {
                checklistItems.innerHTML = '<p style="color: #666;">No checklist items available.</p>';
            } else {
                checklistItems.innerHTML = checklist.map(item => `
                    <div class="checklist-item">${item}</div>
                `).join('');
            }
        }
        
        // Load best practices on page load
        loadBestPractices();
    </script>
</body>
</html>
